<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>U-CONNECT - Create Account</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="container">

        <div class="right-panel">
            <div class="form-box">
                <h2>Create an Account</h2>
                <p class="subtitle">Enter your details to create a new account.</p>

                <!-- Without JavaScript the form opens the student login; the script below switches it by role -->
                <form id="registerForm" action="student-login.html" method="GET">

                    <div class="input-group">
                        <label for="account-type">Account Type</label>
                        <select id="account-type" name="account-type" required>
                            <option value="student">Student</option>
                            <option value="committee">Committee</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" required>
                    </div>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" required>
                    </div>

                    <button type="submit" class="submit-btn admin-btn">Create Account</button>
                </form>

            </div>
        </div>

    </div>

    <script>
        // After signing up, send students to the student login and committee/admin to the staff login
        document.getElementById('registerForm').addEventListener('submit', function () {
            var type = document.getElementById('account-type').value;
            this.action = (type === 'student') ? 'student-login.html' : 'admin-login.html';
        });
    </script>

</body>
</html>
